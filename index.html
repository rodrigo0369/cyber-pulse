html <!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> <title>Cyber Pulse Mobile</title> <meta name="theme-color" content="#030712"> <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"> <style> * { user-select: none; -webkit-user-select: none; touch-action: none; } body { font-family: 'Rajdhani', sans-serif; background-color: #030712; } .font-arcade { font-family: 'Orbitron', monospace; } </style> </head> <body class="bg-gray-950 text-white h-screen w-screen overflow-hidden flex flex-col justify-center items-center"> <div class="relative w-full max-w-md h-full max-h-[900px] overflow-hidden bg-black shadow-2xl border-x border-cyan-900/30"> <!-- Canvas Principal --> <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas> <!-- Barra de Vida del Jefe HUD --> <div id="bossHud" class="hidden absolute top-14 left-4 right-4 bg-gray-900/90 border border-red-500/50 rounded-lg p-2 backdrop-blur-md transition-all"> <div class="flex justify-between items-center text-xs font-arcade text-red-400 mb-1"> <span id="bossName">TITÁN CYBER-CORE MK-I</span> <span id="bossHpPercent">100%</span> </div> <div class="w-full h-3 bg-gray-950 rounded-full overflow-hidden border border-red-900/50"> <div id="bossHpFill" class="h-full bg-gradient-to-r from-red-600 via-yellow-500 to-cyan-400 w-full transition-all duration-100"></div> </div> </div> <!-- Banner de Transición de Fase del Jefe --> <div id="phaseAlert" class="hidden absolute top-1/3 left-0 right-0 py-3 text-center bg-red-600/20 border-y border-red-500 text-red-300 font-arcade text-sm uppercase tracking-widest animate-pulse backdrop-blur-md pointer-events-none"> PHASE 2: OVERHEAT MATRIX ENGAGED </div> <!-- HUD Superior Móvil --> <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none"> <!-- Monedas y Nivel --> <div class="flex gap-2"> <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-yellow-950/70 border border-yellow-500/40 text-yellow-300 text-xs font-bold shadow-lg"> <span>🪙</span> <span id="coinCount">60</span> </div> <div class="flex items-center gap-1 px-3 py-1 rounded-full bg-cyan-950/70 border border-cyan-500/40 text-cyan-300 text-xs font-arcade"> <span>LVL</span> <span id="lvlDisplay">1</span> </div> </div> <!-- Controles Superiores: Música, Vibración Háptica, Sonido SFX --> <div class="flex items-center gap-2 pointer-events-auto"> <!-- Música Synthwave --> <button id="btnMusic" class="w-9 h-9 flex items-center justify-center rounded-xl bg-cyan-950/80 border border-cyan-500/40 text-cyan-400 text-sm active:scale-90 transition shadow-lg"> 🎵 </button> <!-- Vibración On/Off --> <button id="btnHaptic" class="w-9 h-9 flex items-center justify-center rounded-xl bg-emerald-950/80 border border-emerald-500/40 text-emerald-400 text-xs font-bold active:scale-90 transition shadow-lg"> 📳 </button> <!-- SFX Mute --> <button id="btnSound" class="w-9 h-9 flex items-center justify-center rounded-xl bg-cyan-950/80 border border-cyan-500/40 text-cyan-400 text-sm active:scale-90 transition shadow-lg"> 🔊 </button> </div> </div> <!-- Controles Inferiores Móviles (Habilidad Activa + Bomba EMP) --> <div class="absolute bottom-5 left-4 right-4 flex justify-between items-end pointer-events-none"> <!-- Habilidad Activa --> <button id="btnSkill" class="pointer-events-auto relative w-16 h-16 rounded-2xl bg-cyan-950/90 border-2 border-cyan-400 flex flex-col items-center justify-center text-cyan-300 shadow-[0_0_20px_rgba(6,182,212,0.4)] active:scale-95 transition overflow-hidden"> <span class="text-xl">⚡</span> <span class="text-[10px] font-bold font-arcade tracking-tighter">HABILIDAD</span> <div id="skillOverlay" class="absolute inset-0 bg-black/80 flex items-center justify-center text-xs font-bold font-arcade text-cyan-400 hidden"></div> </button> <!-- Botón EMP Bomba --> <button id="btnEmp" class="pointer-events-auto relative w-16 h-16 rounded-2xl bg-red-950/90 border-2 border-red-500 flex flex-col items-center justify-center text-red-300 shadow-[0_0_20px_rgba(239,68,68,0.4)] active:scale-95 transition"> <span class="text-xl">💣</span> <span class="text-[10px] font-bold font-arcade tracking-tighter">EMP BOMBA</span> <span id="empBadge" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-black font-extrabold text-[11px] rounded-full flex items-center justify-center">1</span> </button> </div> <!-- Menú Inicial / Game Over Overlay --> <div id="startOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20"> <h1 class="text-4xl font-extrabold font-arcade text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-400 to-yellow-300 tracking-wider mb-2">CYBER PULSE</h1> <p class="text-cyan-400 font-medium text-xs tracking-widest mb-6">EDICIÓN MÓVIL ANDROID & iOS</p> <div class="w-20 h-20 rounded-2xl border-2 border-dashed border-cyan-400 flex items-center justify-center text-4xl mb-4 shadow-[0_0_25px_rgba(6,182,212,0.3)] bg-cyan-950/30"> 🚀 </div> <p class="text-xs text-gray-300 mb-8 max-w-xs leading-relaxed"> Desliza con el dedo para esquivar y disparar.<br> Usa los botones táctiles para activar Habilidades y la Bomba EMP. </p> <buttonid="btnStart" class="w-full max-w-xs py-4 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-arcade font-black text-sm tracking-wider shadow-[0_0_25px_rgba(6,182,212,0.6)] active:scale-95 transition uppercase"> DESLIZA PARA EMPEZAR </button> </div> </div> <script> // --- LÓGICA DEL JUEGO COMPLETA --- const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; } window.addEventListener('resize', resize); resize(); // Estado general let gameState = 'START'; let score = 0; let coins = 60; let level = 1; let hapticEnabled = true; let soundMuted = false; let musicActive = false; // Vibración háptica segura function triggerHaptic(pattern) { if (hapticEnabled && navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} } } // Audio sintetizado en Web Audio API (No requiere archivos externos) let audioCtx = null; function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } function playSfx(freq, type = 'sine', duration = 0.1) { if (soundMuted || !audioCtx) return; try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } catch(e){} } // Jugador const player = { x: canvas.width / 2, y: canvas.height - 120, radius: 18, speed: 8, empBombs: 1, skillCooldown: 0, skillMaxCd: 600, // 10 segundos a 60fps color: '#06b6d4' }; let enemies = []; let bullets = []; let enemyBullets = []; let boss = null; let bossTimer = 0; // Controles táctiles let touchX = null; let touchY = null; canvas.addEventListener('touchstart', (e) => { initAudio(); const rect = canvas.getBoundingClientRect(); touchX = e.touches[0].clientX - rect.left; touchY = e.touches[0].clientY - rect.top; if (gameState === 'START') startGame(); }); canvas.addEventListener('touchmove', (e) => { const rect = canvas.getBoundingClientRect(); const currentX = e.touches[0].clientX - rect.left; const currentY = e.touches[0].clientY - rect.top; if (touchX !== null) { player.x += (currentX - touchX) * 1.3; player.y += (currentY - touchY) * 1.3; // Límites de pantalla player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x)); player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y)); } touchX = currentX; touchY = currentY; }); canvas.addEventListener('touchend', () => { touchX = null; touchY = null; }); // Habilidad Activa document.getElementById('btnSkill').addEventListener('click', () => { initAudio(); if (player.skillCooldown <= 0 && gameState === 'PLAY') { player.skillCooldown = player.skillMaxCd; triggerHaptic([40, 60, 40]); playSfx(880, 'square', 0.25); // Rayo Concentrado: elimina proyectiles y daña jefe enemyBullets = []; if (boss) boss.hp -= 25; } }); // Bomba EMP document.getElementById('btnEmp').addEventListener('click', () => { initAudio(); if (player.empBombs > 0 && gameState === 'PLAY') { player.empBombs--; document.getElementById('empBadge').innerText = player.empBombs; triggerHaptic([80, 50, 80]); playSfx(150, 'sawtooth', 0.4); enemies = []; enemyBullets = []; if (boss) boss.hp -= 35; } }); // Botones de Mute y Háptico document.getElementById('btnSound').addEventListener('click', (e) => { soundMuted = !soundMuted; e.currentTarget.innerText = soundMuted ? '🔇' : '🔊'; }); document.getElementById('btnHaptic').addEventListener('click', (e) => { hapticEnabled = !hapticEnabled; e.currentTarget.innerText = hapticEnabled ? '📳' : '📴'; if (hapticEnabled) triggerHaptic([50]); }); document.getElementById('btnMusic').addEventListener('click', () => { initAudio(); musicActive = !musicActive; document.getElementById('btnMusic').style.borderColor = musicActive ? '#ec4899' : '#06b6d4'; }); function startGame() { gameState = 'PLAY'; document.getElementById('startOverlay').classList.add('hidden'); score = 0; enemies = []; enemyBullets = []; boss = null; bossTimer = 0; player.x = canvas.width / 2; player.y = canvas.height - 130; player.empBombs = 1; document.getElementById('empBadge').innerText = '1'; } // Spawn Boss con 3 Fases function spawnBoss() { boss = { x: canvas.width / 2, y: 80, radius: 35, hp: 100, maxHp: 100, phase: 1, shootTimer: 0 }; document.getElementById('bossHud').classList.remove('hidden'); } // Bucle del juego let frame = 0; function loop() {requestAnimationFrame(loop); frame++; ctx.fillStyle = '#030712'; ctx.fillRect(0, 0, canvas.width, canvas.height); if (gameState !== 'PLAY') return; // Autodisparo del jugador if (frame % 8 === 0) { bullets.push({ x: player.x - 8, y: player.y - 20, vy: -12 }); bullets.push({ x: player.x + 8, y: player.y - 20, vy: -12 }); playSfx(520, 'triangle', 0.05); } // Dibujar y mover balas del jugador ctx.fillStyle = '#22d3ee'; for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; b.y += b.vy; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); if (b.y < -10) bullets.splice(i, 1); } // Cooldown de habilidad if (player.skillCooldown > 0) { player.skillCooldown--; const overlay = document.getElementById('skillOverlay'); overlay.classList.remove('hidden'); overlay.innerText = Math.ceil(player.skillCooldown / 60) + 's'; } else { document.getElementById('skillOverlay').classList.add('hidden'); } // Spawn y lógica de Jefe bossTimer++; if (bossTimer > 900 && !boss) spawnBoss(); if (boss) { // Movimiento del jefe boss.x += Math.sin(frame * 0.05) * 3; // Fases del jefe const hpPct = (boss.hp / boss.maxHp) * 100; document.getElementById('bossHpFill').style.width = Math.max(0, hpPct) + '%'; document.getElementById('bossHpPercent').innerText = Math.max(0, Math.round(hpPct)) + '%'; if (hpPct <= 33 && boss.phase !== 3) { boss.phase = 3; triggerHaptic([100, 100, 100]); const alert = document.getElementById('phaseAlert'); alert.innerText = 'PHASE 3: ENRAGE PROTOCOL'; alert.classList.remove('hidden'); setTimeout(() => alert.classList.add('hidden'), 2500); } else if (hpPct <= 66 && hpPct > 33 && boss.phase !== 2) { boss.phase = 2; triggerHaptic([80, 80]); const alert = document.getElementById('phaseAlert'); alert.innerText = 'PHASE 2: OVERHEAT MATRIX'; alert.classList.remove('hidden'); setTimeout(() => alert.classList.add('hidden'), 2000); } // Disparo del jefe según fase boss.shootTimer++; const fireRate = boss.phase === 3 ? 15 : (boss.phase === 2 ? 25 : 40); if (boss.shootTimer > fireRate) {boss.shootTimer = 0; enemyBullets.push({ x: boss.x, y: boss.y + 30, vx: 0, vy: 5 }); if (boss.phase >= 2) { enemyBullets.push({ x: boss.x, y: boss.y + 30, vx: -2.5, vy: 4.5 }); enemyBullets.push({ x: boss.x, y: boss.y + 30, vx: 2.5, vy: 4.5 }); } } // Colisión balas jugador vs Jefe for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; const dist = Math.hypot(b.x - boss.x, b.y - boss.y); if (dist < boss.radius) { boss.hp -= 1.2; bullets.splice(i, 1); if (boss.hp <= 0) { boss = null; document.getElementById('bossHud').classList.add('hidden'); coins += 50; document.getElementById('coinCount').innerText = coins; bossTimer = 0; break; } } } // Dibujar Jefe if (boss) { ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = boss.phase === 3 ? '#ef4444' : (boss.phase === 2 ? '#f59e0b' : '#06b6d4'); ctx.fillStyle = ctx.shadowColor; ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); } } // Spawn de enemigos comunes if (!boss && frame % 45 === 0) { enemies.push({ x: Math.random() * (canvas.width - 40) + 20, y: -20, vy: Math.random() * 2 + 2, radius: 12 }); } // Dibujar y mover enemigos comunes ctx.fillStyle = '#ef4444'; for (let i = enemies.length - 1; i >= 0; i--) { const e = enemies[i]; e.y += e.vy; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill(); // Colisión con balas for (let j = bullets.length - 1; j >= 0; j--) { const b = bullets[j]; if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 3) { enemies.splice(i, 1); bullets.splice(j, 1); coins += 2; document.getElementById('coinCount').innerText = coins; break; } } // Colisión con el jugador if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) { triggerHaptic([150, 100, 150]); gameState = 'START';document.getElementById('startOverlay').classList.remove('hidden'); } if (e.y > canvas.height + 20) enemies.splice(i, 1); } // Proyectiles enemigos ctx.fillStyle = '#f97316'; for (let i = enemyBullets.length - 1; i >= 0; i--) { const eb = enemyBullets[i]; eb.x += eb.vx; eb.y += eb.vy; ctx.beginPath(); ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2); ctx.fill(); if (Math.hypot(eb.x - player.x, eb.y - player.y) < player.radius + 4) { triggerHaptic([150, 100, 150]); gameState = 'START'; document.getElementById('startOverlay').classList.remove('hidden'); } if (eb.y > canvas.height + 20) enemyBullets.splice(i, 1); } // Dibujar Jugador ctx.save(); ctx.shadowBlur = 15; ctx.shadowColor = '#06b6d4'; ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); } loop(); document.getElementById('btnStart').addEventListener('click', startGame); </script> </body> </html>
